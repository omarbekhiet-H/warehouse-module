<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول — {{ app_name }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<style>
  :root { --erp-primary:#1e5b93; --erp-accent:#0d6efd; }
  body { font-family:"Segoe UI",Tahoma,Arial,sans-serif; background:#f6f8fb; color:#212529;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { width:100%; max-width:420px; border:0; box-shadow:0 2px 12px rgba(30,91,147,.18);
                border-radius:.6rem; overflow:hidden; }
  .login-header { background:var(--erp-primary); color:#fff; padding:1.2rem 1.5rem; text-align:center; }
  .login-header h4 { margin:0; font-weight:800; }
  .login-body { background:#fff; padding:1.5rem; }
  .btn-erp { background:var(--erp-primary); color:#fff; border:0; font-weight:700; width:100%; }
  .btn-erp:hover { background:#164a79; color:#fff; }
  .form-control:focus { border-color:var(--erp-accent); box-shadow:0 0 0 .15rem rgba(13,110,253,.15); }
  .alert-pwd { display:none; background:#fff3cd; border:1px solid #ffe08a; border-radius:.4rem;
               padding:.6rem .8rem; font-size:.85rem; margin-bottom:1rem; }
</style>
</head>
<body>
<div class="card login-card">
  <div class="login-header">
    <h4>🏭 {{ app_name }}</h4>
    <small>نظام إدارة المخازن والمحاسبة — تسجيل دخول المستخدمين</small>
  </div>
  <div class="login-body">
    <div id="mustChange" class="alert-pwd">⚠️ هذه أول دخول لك — يجب تغيير كلمة المرور المؤقتة من الشاشة الرئيسة بعد الدخول.</div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="mb-3">
        <label class="form-label fw-bold">اسم المستخدم</label>
        <input id="username" class="form-control" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">كلمة المرور</label>
        <input id="password" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <div id="err" class="text-danger small mb-2" style="display:none"></div>
      <button class="btn btn-erp" id="btnLogin" type="submit">دخول</button>
    </form>
    <hr class="my-3">
    <div class="d-flex justify-content-between small">
      <a href="/docs" target="_blank" style="color:var(--erp-accent);text-decoration:none">📚 وثائق API</a>
      <span class="text-muted">الإصدار {{ version }}</span>
    </div>
  </div>
</div>

<script>
async function doLogin(e){
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'جارٍ التحقق...'; err.style.display='none';
  try{
    const r = await fetch('/api/v1/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const j = await r.json();
    if(r.ok && j.success){
      sessionStorage.setItem('erp_token', j.data.access_token);
      sessionStorage.setItem('erp_refresh', j.data.refresh_token);
      sessionStorage.setItem('erp_user', JSON.stringify({username: document.getElementById('username').value.trim()}));
      if(j.data.must_change_password)
        document.getElementById('mustChange').style.display='block';
      location.href = '/';
    } else {
      err.textContent = j.message || j.detail || 'بيانات الدخول غير صحيحة';
      err.style.display='block';
    }
  }catch(ex){
    err.textContent = 'تعذر الاتصال بالخادم — تأكد أن uvicorn يعمل';
    err.style.display='block';
  }
  btn.disabled = false; btn.textContent = 'دخول';
  return false;
}
</script>
</body>
</html>
