<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<style>
  :root { --erp-primary:#1e5b93; --erp-accent:#0d6efd; }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background:#f6f8fb; color:#212529; }
  .report-header { background:var(--erp-primary); color:#fff; padding:1rem 1.5rem; border-radius:.5rem .5rem 0 0; }
  .report-header h4 { margin:0; font-weight:700; }
  .report-meta { font-size:.85rem; opacity:.9; }
  .card-erp { border:0; box-shadow:0 1px 6px rgba(30,91,147,.12); border-radius:.5rem; overflow:hidden; }
  table.report { width:100%; border-collapse:collapse; font-size:.9rem; }
  table.report th { background:#eaf1f8; color:var(--erp-primary); padding:.5rem .75rem; border-bottom:2px solid var(--erp-primary); white-space:nowrap; }
  table.report td { padding:.45rem .75rem; border-bottom:1px solid #e9edf2; }
  tr.section-total td { font-weight:700; background:#f2f7fc; border-top:2px solid var(--erp-primary); }
  tr.grand-total td { font-weight:800; color:var(--erp-primary); background:#dfeaf5; }
  .num { text-align:left; direction:ltr; font-variant-numeric:tabular-nums; }
  .pos { color:#146c43; } .neg { color:#b02a37; }
  .badge-balanced { background:#198754; } .badge-unbalanced { background:#dc3545; }
  @media print {
    body { background:#fff; }
    .no-print { display:none !important; }
    .card-erp { box-shadow:none; }
    @page { size: A4 landscape; margin: 1cm; }
  }
</style>
</head>
<body class="py-4">
<div class="container-xl">
  <div class="card card-erp">
    <div class="report-header d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h4>{{ title }}</h4>
        {% block subtitle %}{% endblock %}
      </div>
      <div class="report-meta text-start">
        <div>تاريخ الإصدار: {{ generated_at }}</div>
        {% block header_extra %}{% endblock %}
      </div>
    </div>
    <div class="card-body bg-white">
      {% block content %}{% endblock %}
    </div>
  </div>
  <div class="no-print mt-3 d-flex gap-2">
    <button class="btn btn-primary" onclick="window.print()">🖨️ طباعة</button>
    <button class="btn btn-outline-secondary" onclick="window.close()">إغلاق</button>
  </div>
</div>
{% if print_auto %}<script>window.addEventListener('load',()=>setTimeout(()=>window.print(),300));</script>{% endif %}
</body>
</html>
